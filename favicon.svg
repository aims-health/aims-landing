<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a22"/>
      <stop offset="100%" stop-color="#0a0a0e"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Liquid Glass square base -->
  <rect x="0" y="0" width="512" height="512" rx="113" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="113" fill="url(#sheen)"/>
  <rect x="0.5" y="0.5" width="511" height="511" rx="112.5" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Wave — canonical path (viewBox 0 0 60 32), scaled+centered.
       Source path: M 1 28 C 6 28, 12 8, 20 8 C 28 8, 32 24, 42 24 C 52 24, 56 -4, 60 -4 -->
  <g transform="translate(76 144) scale(6)">
    <path d="M 1 28 C 6 28, 12 8, 20 8 C 28 8, 32 24, 42 24 C 52 24, 56 -4, 60 -4"
          fill="none" stroke="url(#wave)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  </g>
</svg>